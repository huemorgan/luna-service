server {
    listen 80;

    location / {
        proxy_pass http://luna:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Inject trusted-proxy headers
        proxy_set_header X-Luna-User "alice@example.com";
        proxy_set_header X-Luna-Proxy-Secret "dev-secret-12345";

        # SSE: disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
}
