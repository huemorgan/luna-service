services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: local-luna-postgres
    environment:
      POSTGRES_USER: luna
      POSTGRES_PASSWORD: luna
      POSTGRES_DB: luna
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql
    healthcheck:
      test: pg_isready -U luna
      interval: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: local-luna-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: redis-cli ping
      interval: 2s
      retries: 10

  luna:
    build:
      context: ../../luna
      dockerfile: Dockerfile
    container_name: local-luna-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LUNA_ENV: dev
      LUNA_AUTH_MODE: trusted_proxy
      LUNA_TRUSTED_PROXY_SECRET: dev-secret-12345
      LUNA_DATABASE_URL: postgresql+asyncpg://luna:luna@postgres:5432/luna
      LUNA_REDIS_URL: redis://redis:6379/0
      LUNA_VAULT_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      LUNA_ANTHROPIC_API_KEY: ${LUNA_ANTHROPIC_API_KEY:-}
      LUNA_OPENAI_API_KEY: ${LUNA_OPENAI_API_KEY:-}
      LUNA_TAVILY_API_KEY: ${LUNA_TAVILY_API_KEY:-}
      LUNA_CORS_ORIGINS: "*"
      LUNA_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test: curl -fs http://localhost:8000/api/health || exit 1
      interval: 3s
      retries: 20
      start_period: 15s

  proxy:
    image: nginx:alpine
    container_name: local-luna-proxy
    depends_on:
      luna:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
