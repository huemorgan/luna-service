# plugin-set.toml — default/seed for the image-baked plugin set (Plan 019).
#
# This is ONLY the fallback used when an image has no UI selection
# (image_config.plugin_set is empty). The real source of truth is the admin
# "Plugin Set" picker, which writes per-image selections captured live from the
# marketplace index.json. The build (scripts/bake_plugin_set.py) prefers the UI
# selection (plugin-set.json) and falls back to this file.
#
# Curated leaf set: charts + web-access + files. Connectors (monday/render/
# cloudflare) are NOT bakeable yet — they carry PyPI deps that hit the
# dependency-isolation problem (Luna 008.5 §5).
#
# `sha256` pins the exact artifact; the build fails closed on any mismatch.
# Refresh these from the official index when the marketplace publishes new
# versions:
#   curl -s https://luna-marketplaces.onrender.com/mp/official/index.json
marketplace = "https://luna-marketplaces.onrender.com/mp/official/"

[[plugins]]
name = "plugin-charts"
version = "0.1.0"
sha256 = "52e063f327a2f1ed505b239344eca9aadb0806fe1921e3f6b58f0f0ba0a9f1b9"

# 0.2.1: fixes on_load crash on luna 0.19.x (stdlib logger got a `tools=` kwarg).
[[plugins]]
name = "plugin-web-access"
version = "0.2.1"
sha256 = "cf498f4d05c3a75db77226168f64752f3a02067a71e282f615600fdc1a66c4fa"

# Plan 025.5: plugin-files 0.4.0 adds the pluggable `fly` backend (durable Fly
# volume mode via LUNA_FILES_BACKEND=fly / LUNA_FILES_ROOT / LUNA_FILES_DURABLE).
# plugin-browser 0.3.1 routes screenshots through the StorageProvider.
# Requires a luna core with ctx.storage (008.95 Phase A) — present from 0.19.000.
# Plan 025.5: re-pinned from the official index (plugin-files 0.4.0 published).
# Remember to also set the admin Plugin Set picker (image_config.plugin_set) to
# 0.4.0 with this same sha256. The build fails closed on a mismatch.
[[plugins]]
name = "plugin-files"
version = "0.4.0"
sha256 = "cb14560803782dfe6fea8d936c81ff9f904534045004fde1d3f3fe2b60ccfca9"

[[plugins]]
name = "plugin-browser"
version = "0.3.1"
sha256 = "a09a5a013ef98b3dfe2247aff66bbbfaa3e55dc711e48b00534b079ffe913cbb"
