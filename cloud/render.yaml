services:
  - type: web
    name: luna-service
    runtime: docker
    dockerfilePath: ./cloud/Dockerfile
    dockerContext: .
    # SPEED101 (plan 037 §13): live service runs `starter`; 2 uvicorn workers
    # fit its 512 MB (RSS ~105 MB each). Declared `standard` was aspirational —
    # synced to reality. Upgrade deliberately if worker RSS grows.
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: CLOUD_ENV
        value: production
      - key: CLOUD_SESSION_SECRET
        generateValue: true
      - key: CLOUD_DATABASE_URL
        fromDatabase:
          name: luna-service-cp
          property: connectionString
      - key: CLOUD_IDENTITY_PROVIDER
        value: google
      - key: CLOUD_GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUD_GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUD_GOOGLE_REDIRECT_URI
        sync: false
      - key: CLOUD_BASE_URL
        value: https://luna.com.ai

databases:
  - name: luna-service-cp
    # SPEED101 (plan 037 §13): live DB is accelerated-16gb (upgraded Jul 2026).
    plan: accelerated-16gb
    region: oregon
    postgresMajorVersion: "16"
